  <!-- 導覽列 -->
  <nav class="navbar">
    <a href="../index.html" class="navbar__brand">
      <span class="navbar__logo">AIZO</span>
      <span class="navbar__subtitle">SHINKIRŌ</span>
    </a>

    <button class="navbar__toggle" id="navToggle" aria-label="選單">
      <span></span>
      <span></span>

    <div class="navbar__menu" id="navMenu">
      <ul class="navbar__nav">

        <li><a href="entry.html" class="navbar__link">ENTRY</a></li>
        <li><a href="contact.html" class="navbar__link">CONTACT</a></li>
      </ul>

  <!-- 主內容 -->
  <main class="page">
    <div class="page__title">
      <h2>活動</h2>
      <p>EVENTS</p>
      <div class="divider"></div>
    </div>

    <!-- 即將舉辦 -->
    <section class="events-section" id="upcomingSection" style="display: none;">
      <div class="events-section__head">
        <span class="events-section__label">— Upcoming —</span>
        <h3 class="events-section__title">即將舉辦</h3>
        <span class="events-section__line"></span>
      </div>
      <div class="events-list" id="upcomingList">
        <!-- JS 注入 -->
      </div>
    </section>

    <!-- 定期活動 -->
    <section class="events-section" id="regularSection" style="display: none;">
      <div class="events-section__head">
        <span class="events-section__label">— Regular —</span>
        <h3 class="events-section__title">定期活動</h3>
        <span class="events-section__line"></span>
      </div>
      <div class="events-grid" id="regularList">
        <!-- JS 注入 -->
      </div>
    </section>

    <!-- 過往活動 -->
    <section class="events-section" id="pastSection" style="display: none;">
      <div class="events-section__head">
        <span class="events-section__label">— Archive —</span>
        <h3 class="events-section__title">過往活動</h3>
        <span class="events-section__line"></span>
      </div>
      <div id="pastList">
        <!-- JS 注入 -->
      </div>
    </section>
